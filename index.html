<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Palestra RUI: allenamento per la prova di idoneità IVASS, modulo assicurativo." />
    <title>Palestra RUI</title>
    <script>
      try {
        var t = localStorage.getItem("palestra-rui-tema");
        var d = t === "scuro" || (t !== "chiaro" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
